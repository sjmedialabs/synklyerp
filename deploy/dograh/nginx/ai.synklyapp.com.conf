# Host nginx — ai.synklyapp.com → Dograh (localhost)
# Install: /etc/nginx/sites-available/ai.synklyapp.com
# Enable:  ln -sf /etc/nginx/sites-available/ai.synklyapp.com /etc/nginx/sites-enabled/
#
# Based on Dograh upstream routing:
#   /api/v1/      → API (8000)
#   /voice-audio/ → MinIO (9000)
#   /             → UI (3010)

upstream dograh_api {
    server 127.0.0.1:18000;
    keepalive 8;
}

upstream dograh_ui {
    server 127.0.0.1:3010;
    keepalive 8;
}

upstream dograh_minio {
    server 127.0.0.1:9000;
    keepalive 4;
}

server {
    listen 80;
    listen [::]:80;
    server_name ai.synklyapp.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai.synklyapp.com;

    # Certbot will inject these paths (or set manually after certbot --nginx)
    ssl_certificate     /etc/letsencrypt/live/ai.synklyapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.synklyapp.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    location /api/v1/ {
        proxy_pass http://dograh_api;
        proxy_http_version 1.1;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /voice-audio/ {
        proxy_pass http://dograh_minio/voice-audio/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://dograh_ui;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
