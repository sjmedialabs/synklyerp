# Bind Dograh to localhost only — host nginx terminates SSL.
# !reset clears base compose host ports (5432/6379/8000 conflict with Supabase/itu-redis).
# API uses 18000 because Supabase Kong already binds 0.0.0.0:8000.

services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  ui:
    ports: !reset ["127.0.0.1:3010:3010"]

  api:
    ports: !reset ["127.0.0.1:18000:8000"]

  minio:
    ports: !reset ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
